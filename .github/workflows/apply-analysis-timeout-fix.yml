name: Apply analysis timeout resilience fix

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Patch analysis pipeline and progress UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          edge_path = Path('supabase/functions/analyze-concept/index.ts')
          edge = edge_path.read_text()

          research_import = '''} from "../_shared/analysis/research.ts";\n'''
          gateway_import = '''} from "../_shared/analysis/research.ts";\nimport {\n  compactResearchContext,\n  GatewayAttemptError,\n  requestStructuredReport,\n  safeGatewayUserError,\n} from "../_shared/analysis/gateway.ts";\n'''
          if '../_shared/analysis/gateway.ts' not in edge:
              if research_import not in edge:
                  raise SystemExit('research import anchor not found')
              edge = edge.replace(research_import, gateway_import, 1)

          edge = edge.replace(
              '${JSON.stringify(publicResearch, null, 2)}',
              '${JSON.stringify(compactResearchContext(publicResearch), null, 2)}',
              1,
          )

          start_marker = '    const modelId = Deno.env.get("ANALYSIS_MODEL_ID") || "google/gemini-2.5-flash";\n'
          end_marker = '    const parsed = JSON.parse(args);\n'
          start = edge.find(start_marker)
          end = edge.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('model request block anchors not found')
          end += len(end_marker)

          replacement = '''    const primaryModelId = Deno.env.get("ANALYSIS_MODEL_ID") || "google/gemini-3-flash-preview";\n    const fallbackModelId = Deno.env.get("ANALYSIS_FALLBACK_MODEL_ID") || "google/gemini-2.5-flash";\n    const modelCandidates = fallbackModelId && fallbackModelId !== primaryModelId\n      ? [primaryModelId, fallbackModelId]\n      : [primaryModelId];\n    const promptVersion = "concept-ai-2026-07-18.3";\n    failureCategory = "ai_request";\n\n    let modelId = primaryModelId;\n    let data: any = null;\n    let parsed: any = null;\n    let lastGatewayError: GatewayAttemptError | null = null;\n\n    for (let attemptIndex = 0; attemptIndex < modelCandidates.length; attemptIndex++) {\n      modelId = modelCandidates[attemptIndex];\n      modelIdForLog = modelId;\n      try {\n        const result = await requestStructuredReport({\n          apiKey: LOVABLE_API_KEY,\n          modelId,\n          systemPrompt,\n          userPrompt,\n          schema: reportSchema,\n          timeoutMs: attemptIndex === 0 ? 48_000 : 36_000,\n          requestId,\n          attempt: attemptIndex + 1,\n        });\n        data = result.data;\n        parsed = result.parsed;\n        lastGatewayError = null;\n        break;\n      } catch (error) {\n        if (!(error instanceof GatewayAttemptError)) throw error;\n        lastGatewayError = error;\n        failureCategory = error.category;\n        const hasFallback = attemptIndex < modelCandidates.length - 1;\n        if (!error.retryable || !hasFallback) throw error;\n        console.info(JSON.stringify({\n          event: "ai_fallback_selected",\n          requestId,\n          failedModel: modelId,\n          fallbackModel: modelCandidates[attemptIndex + 1],\n          category: error.category,\n        }));\n      }\n    }\n\n    if (!data || !parsed) {\n      throw lastGatewayError ?? new Error("AI did not return a report");\n    }\n'''
          edge = edge[:start] + replacement + edge[end:]

          old_catch = '''  } catch (e) {\n    if (e instanceof DOMException && e.name === "TimeoutError") failureCategory = "ai_timeout";\n    if (requestId && requestClient) {\n      await requestClient.rpc("complete_analysis_request", {\n        p_request_id: requestId,\n        p_completion_status: "failed",\n        p_model_id: modelIdForLog,\n        p_prompt_version: "concept-ai-2026-07-18.2",\n        p_usage_metadata: {},\n        p_research_status: researchStatus,\n        p_failure_category: failureCategory,\n      }).catch(() => null);\n    }\n    console.error(JSON.stringify({ event: "analysis_failed", requestId, category: failureCategory }));\n    return new Response(JSON.stringify({ error: "Analysis failed. Please try again." }), {\n      status: failureCategory === "ai_timeout" ? 504 : 500,\n      headers: { ...corsHeaders, "Content-Type": "application/json", "Cache-Control": "no-store" },\n    });\n  }\n});\n'''
          new_catch = '''  } catch (e) {\n    const gatewayError = e instanceof GatewayAttemptError ? e : null;\n    if (gatewayError) failureCategory = gatewayError.category;\n    else if (e instanceof DOMException && (e.name === "TimeoutError" || e.name === "AbortError")) failureCategory = "ai_timeout";\n\n    if (requestId && requestClient) {\n      await requestClient.rpc("complete_analysis_request", {\n        p_request_id: requestId,\n        p_completion_status: "failed",\n        p_model_id: modelIdForLog,\n        p_prompt_version: "concept-ai-2026-07-18.3",\n        p_usage_metadata: {},\n        p_research_status: researchStatus,\n        p_failure_category: failureCategory,\n      }).catch(() => null);\n    }\n\n    const safeError = gatewayError\n      ? safeGatewayUserError(gatewayError)\n      : failureCategory === "ai_timeout"\n        ? { status: 504, message: "The analysis took too long. Please retry." }\n        : { status: 500, message: "Analysis failed unexpectedly. Please try again." };\n    console.error(JSON.stringify({ event: "analysis_failed", requestId, category: failureCategory }));\n    return new Response(JSON.stringify({ error: safeError.message, requestId }), {\n      status: safeError.status,\n      headers: { ...corsHeaders, "Content-Type": "application/json", "Cache-Control": "no-store" },\n    });\n  }\n});\n'''
          if old_catch not in edge:
              raise SystemExit('outer catch anchor not found')
          edge = edge.replace(old_catch, new_catch, 1)
          edge_path.write_text(edge)

          ui_path = Path('src/pages/Analyze.tsx')
          ui = ui_path.read_text()
          state_anchor = '''  const [isAnalyzing, setIsAnalyzing] = useState(false);\n'''
          state_replacement = '''  const [isAnalyzing, setIsAnalyzing] = useState(false);\n  const [analysisElapsed, setAnalysisElapsed] = useState(0);\n  const [analysisPhase, setAnalysisPhase] = useState<"working" | "saving">("working");\n'''
          if 'analysisElapsed' not in ui:
              if state_anchor not in ui:
                  raise SystemExit('analysis state anchor not found')
              ui = ui.replace(state_anchor, state_replacement, 1)

          effect_anchor = '''  // Per-field validation errors collected by validateStep(). Cleared on field change.\n'''
          effect_block = '''  useEffect(() => {\n    if (!isAnalyzing) {\n      setAnalysisElapsed(0);\n      return;\n    }\n    const startedAt = Date.now();\n    const timer = window.setInterval(() => {\n      setAnalysisElapsed(Math.floor((Date.now() - startedAt) / 1000));\n    }, 1000);\n    return () => window.clearInterval(timer);\n  }, [isAnalyzing]);\n\n  const analysisLabel = analysisPhase === "saving"\n    ? "Saving report"\n    : analysisElapsed < 8\n      ? "Researching evidence"\n      : analysisElapsed < 52\n        ? "Generating report"\n        : "Validating response";\n\n  // Per-field validation errors collected by validateStep(). Cleared on field change.\n'''
          if 'const analysisLabel' not in ui:
              if effect_anchor not in ui:
                  raise SystemExit('analysis effect anchor not found')
              ui = ui.replace(effect_anchor, effect_block, 1)

          ui = ui.replace(
              '''    setIsAnalyzing(true);\n    try {\n''',
              '''    setAnalysisPhase("working");\n    setIsAnalyzing(true);\n    try {\n''',
              1,
          )
          ui = ui.replace(
              '''      // Enrich with evidence layer\n      let enriched = ensureEvidenceFields(data, analyzedInputs);\n''',
              '''      // Enrich with evidence layer\n      setAnalysisPhase("saving");\n      let enriched = ensureEvidenceFields(data, analyzedInputs);\n''',
              1,
          )
          ui = ui.replace(
              '''    } finally {\n      setIsAnalyzing(false);\n    }\n''',
              '''    } finally {\n      setIsAnalyzing(false);\n      setAnalysisPhase("working");\n    }\n''',
              1,
          )

          old_button = '''              {isAnalyzing\n                ? <><Loader2 className="h-4 w-4 animate-spin" /> Analyzing…</>\n                : isReRun\n'''
          new_button = '''              {isAnalyzing\n                ? <><Loader2 className="h-4 w-4 animate-spin" /> {analysisLabel}{analysisElapsed > 0 ? ` · ${analysisElapsed}s` : ""}</>\n                : isReRun\n'''
          if old_button not in ui:
              raise SystemExit('analysis button anchor not found')
          ui = ui.replace(old_button, new_button, 1)
          ui_path.write_text(ui)
          PY

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:edge
      - run: npm run test
      - run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-concept/index.ts src/pages/Analyze.tsx
          git commit -m "Fix analysis timeout with model fallback" || exit 0
          git push origin HEAD:main
