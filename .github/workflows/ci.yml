name: CI

on:
  pull_request:
  push:
    branches: [main, fix/hackathon-readiness]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:edge
      - run: npm run test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
      - name: Start local Supabase services and apply migrations
        run: npx --yes supabase@2.109.1 start -x studio,imgproxy,inbucket,vector,logflare,supavisor
      - name: Run database and RLS tests
        run: npx --yes supabase@2.109.1 test db supabase/tests/database/rls_hackathon.sql
