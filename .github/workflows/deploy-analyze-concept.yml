name: Deploy analyze-concept

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/analyze-concept/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-analyze-concept.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-analyze-concept-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: smjiyjenxbtfiiovxbnq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is required for Edge Function deployment." >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Deploy authenticated analysis function
        run: supabase functions deploy analyze-concept --project-ref "$PROJECT_ID" --use-api
