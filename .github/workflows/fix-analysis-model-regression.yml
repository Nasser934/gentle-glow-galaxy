name: Fix analysis model regression

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Apply stable single-model analysis fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          edge_path = Path('supabase/functions/analyze-concept/index.ts')
          edge = edge_path.read_text()
          start_marker = '    const primaryModelId = Deno.env.get("ANALYSIS_MODEL_ID") || "google/gemini-3-flash-preview";\n'
          end_marker = '''    if (!data || !parsed) {
              throw lastGatewayError ?? new Error("AI did not return a report");
            }
          '''
          start = edge.find(start_marker)
          end = edge.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('analysis model block anchors not found')
          end += len(end_marker)
          replacement = '''    const configuredModelId = (Deno.env.get("ANALYSIS_MODEL_ID") || "").trim();
            // Gemini 3 Flash Preview is intentionally excluded here: this exact large
            // structured report request is rejected by the gateway with HTTP 400.
            const modelId = configuredModelId && configuredModelId !== "google/gemini-3-flash-preview"
              ? configuredModelId
              : "google/gemini-2.5-flash";
            modelIdForLog = modelId;
            const promptVersion = "concept-ai-2026-07-18.4";
            failureCategory = "ai_request";

            const result = await requestStructuredReport({
              apiKey: LOVABLE_API_KEY,
              modelId,
              systemPrompt,
              userPrompt,
              schema: reportSchema,
              timeoutMs: 85_000,
              requestId,
              attempt: 1,
            });
            const data = result.data;
            const parsed = result.parsed;
          '''
          edge = edge[:start] + replacement + edge[end:]
          edge = edge.replace('p_prompt_version: "concept-ai-2026-07-18.3"', 'p_prompt_version: "concept-ai-2026-07-18.4"')
          edge_path.write_text(edge)

          gateway_path = Path('supabase/functions/_shared/analysis/gateway.ts')
          gateway = gateway_path.read_text()
          gateway = gateway.replace('        max_tokens: 8_000,', '        max_tokens: 7_000,', 1)
          gateway = gateway.replace(
              '  return { status: 502, message: "The AI provider is temporarily unavailable. Please try again shortly." };',
              '  if (error.status === 400) return { status: 502, message: "The AI service could not accept the structured report request. Please retry." };\n  return { status: 502, message: "The AI provider is temporarily unavailable. Please try again shortly." };',
              1,
          )
          gateway_path.write_text(gateway)

          ui_path = Path('src/pages/Analyze.tsx')
          ui = ui_path.read_text()
          old_label = '''  const analysisLabel = analysisPhase === "saving"
              ? "Saving report"
              : analysisElapsed < 8
                ? "Researching evidence"
                : analysisElapsed < 52
                  ? "Generating report"
                  : "Validating response";
          '''
          new_label = '''  const analysisLabel = analysisPhase === "saving"
              ? "Saving report"
              : "Generating report";
          '''
          if old_label not in ui:
              raise SystemExit('analysis progress label anchor not found')
          ui = ui.replace(old_label, new_label, 1)
          ui_path.write_text(ui)
          PY

          if grep -q 'const primaryModelId.*gemini-3-flash-preview' supabase/functions/analyze-concept/index.ts; then
            echo 'Known-bad preview model still configured as primary' >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:edge
      - run: npm run test
      - run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/analyze-concept/index.ts supabase/functions/_shared/analysis/gateway.ts src/pages/Analyze.tsx
          git commit -m "Use stable model for full report analysis"
          git push origin HEAD:main
