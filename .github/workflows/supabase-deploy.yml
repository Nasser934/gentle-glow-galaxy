name: Supabase Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_db:
        description: "Run Supabase database migrations"
        required: true
        type: boolean
        default: true
      deploy_functions:
        description: "Deploy Supabase Edge Functions"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: smjiyjenxbtfiiovxbnq

jobs:
  deploy:
    name: Deploy Supabase migrations and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            echo "Create it in GitHub: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          if [ "${{ inputs.deploy_db }}" = "true" ] && [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing GitHub secret: SUPABASE_DB_PASSWORD"
            echo "Create it in GitHub: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Link Supabase project
        if: ${{ inputs.deploy_db }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push database migrations
        if: ${{ inputs.deploy_db }}
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy analyze-concept-v2
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy analyze-concept-v2 --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy autofill-brief-v2
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy autofill-brief-v2 --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy complete-field-v2
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy complete-field-v2 --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: List deployed functions
        if: ${{ inputs.deploy_functions }}
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
