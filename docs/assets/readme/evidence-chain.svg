<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
<title id="title">Concept AI evidence and provenance chain</title><desc id="desc">Claims are classified, linked to sources, validated, and rendered consistently.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071317"/><stop offset="1" stop-color="#0C292E"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43C7C7"/></marker></defs>
<rect width="1400" height="480" rx="28" fill="url(#bg)"/>
<text x="65" y="70" fill="#F4F7F8" font-family="Inter,Segoe UI,sans-serif" font-size="33" font-weight="750">Evidence is part of the report — not a footnote.</text><text x="65" y="105" fill="#A6B6BA" font-family="Inter,Segoe UI,sans-serif" font-size="17">Each major claim receives a stable ID, provenance category, and source relationship.</text>
<g font-family="Inter,Segoe UI,sans-serif">
  <g transform="translate(60 155)"><rect width="230" height="245" rx="18" fill="#102A2F" stroke="#285159"/><text x="24" y="40" fill="#43C7C7" font-size="14" font-weight="750">PROVENANCE TYPES</text><g font-size="14" fill="#F4F7F8"><circle cx="28" cy="78" r="6" fill="#43C7C7"/><text x="46" y="83">User input</text><circle cx="28" cy="112" r="6" fill="#54D69A"/><text x="46" y="117">Cited source</text><circle cx="28" cy="146" r="6" fill="#70A7FF"/><text x="46" y="151">Calculation</text><circle cx="28" cy="180" r="6" fill="#F2B84B"/><text x="46" y="185">AI inference</text><circle cx="28" cy="214" r="6" fill="#A98CFF"/><text x="46" y="219">Mixed / unknown</text></g></g>
  <path d="M310 278H370" stroke="#43C7C7" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(390 155)"><rect width="230" height="245" rx="18" fill="#102A2F" stroke="#285159"/><text x="24" y="40" fill="#43C7C7" font-size="14" font-weight="750">CLAIM GRAPH</text><rect x="24" y="70" width="182" height="46" rx="10" fill="#0A1B1F" stroke="#285159"/><text x="40" y="99" fill="#F4F7F8" font-size="14" font-weight="650">CLM-MKT-001</text><rect x="24" y="130" width="182" height="46" rx="10" fill="#0A1B1F" stroke="#285159"/><text x="40" y="159" fill="#F4F7F8" font-size="14" font-weight="650">SRC-WEB-004</text><path d="M115 116V130" stroke="#F2B84B" stroke-width="3"/><text x="24" y="211" fill="#A6B6BA" font-size="13">Direct support · publisher</text><text x="24" y="231" fill="#A6B6BA" font-size="13">date · domain · quality</text></g>
  <path d="M640 278H700" stroke="#43C7C7" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(720 155)"><rect width="250" height="245" rx="18" fill="#102A2F" stroke="#F2B84B"/><text x="24" y="40" fill="#F2B84B" font-size="14" font-weight="750">CANONICAL VALIDATOR</text><g font-size="14" fill="#F4F7F8"><text x="24" y="83">✓ Source IDs exist</text><text x="24" y="118">✓ Figures use one unit parser</text><text x="24" y="153">✓ Financial totals reconcile</text><text x="24" y="188">✓ Confidence caps apply</text><text x="24" y="223">✓ Unsupported claims flagged</text></g></g>
  <path d="M990 278H1050" stroke="#43C7C7" stroke-width="3" marker-end="url(#arr)"/>
  <g transform="translate(1070 155)"><rect width="270" height="245" rx="18" fill="#102A2F" stroke="#43C7C7"/><text x="24" y="40" fill="#43C7C7" font-size="14" font-weight="750">CONSISTENT OUTPUTS</text><g font-size="14" fill="#F4F7F8"><rect x="24" y="66" width="222" height="38" rx="9" fill="#0A1B1F"/><text x="42" y="90">Analysis Dashboard</text><rect x="24" y="116" width="222" height="38" rx="9" fill="#0A1B1F"/><text x="42" y="140">Executive Decision Room</text><rect x="24" y="166" width="222" height="38" rx="9" fill="#0A1B1F"/><text x="42" y="190">PDF · PPTX · XLSX</text><text x="24" y="231" fill="#54D69A" font-weight="700">One canonical report object</text></g></g>
