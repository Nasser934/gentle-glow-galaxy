<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">FMART-O six-dimension feasibility scoring</title><desc id="desc">Financial, Market, Achievability, Risk, Timing, and Operational dimensions feed a deterministic server-calculated score.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08171B"/><stop offset="1" stop-color="#0C292E"/></linearGradient><radialGradient id="glow"><stop stop-color="#43C7C7" stop-opacity=".22"/><stop offset="1" stop-color="#43C7C7" stop-opacity="0"/></radialGradient></defs>
<rect width="1400" height="720" rx="28" fill="url(#bg)"/><circle cx="450" cy="365" r="330" fill="url(#glow)"/>
<text x="70" y="78" fill="#F4F7F8" font-family="Inter,Segoe UI,sans-serif" font-size="35" font-weight="750">FMART-O scoring model</text><text x="70" y="115" fill="#A6B6BA" font-family="Inter,Segoe UI,sans-serif" font-size="18">Six dimensions. Explicit weights. One authoritative server calculation.</text>
<g transform="translate(420 380)" font-family="Inter,Segoe UI,sans-serif">
  <polygon points="0,-220 190,-110 190,110 0,220 -190,110 -190,-110" fill="#0F2D33" stroke="#315F66" stroke-width="2"/>
  <polygon points="0,-160 139,-80 139,80 0,160 -139,80 -139,-80" fill="none" stroke="#244A51"/>
  <polygon points="0,-108 94,-54 94,54 0,108 -94,54 -94,-54" fill="none" stroke="#244A51"/>
  <polygon points="0,-178 142,-82 118,68 0,160 -126,73 -144,-83" fill="#43C7C7" fill-opacity=".20" stroke="#43C7C7" stroke-width="4"/>
  <g fill="#F2B84B"><circle cy="-178" r="7"/><circle cx="142" cy="-82" r="7"/><circle cx="118" cy="68" r="7"/><circle cy="160" r="7"/><circle cx="-126" cy="73" r="7"/><circle cx="-144" cy="-83" r="7"/></g>
  <circle r="74" fill="#071317" stroke="#285159" stroke-width="2"/><text y="-6" text-anchor="middle" fill="#F4F7F8" font-size="38" font-weight="750">7.6</text><text y="28" text-anchor="middle" fill="#43C7C7" font-size="12" font-weight="750" letter-spacing="1.5">OVERALL</text>
  <g font-size="15" font-weight="700" fill="#F4F7F8"><text x="0" y="-246" text-anchor="middle">FINANCIAL</text><text x="220" y="-118">MARKET</text><text x="220" y="125">ACHIEVABILITY</text><text x="0" y="257" text-anchor="middle">RISK</text><text x="-315" y="125">TIMING</text><text x="-300" y="-118">OPERATIONAL</text></g>
</g>
<g transform="translate(800 170)" font-family="Inter,Segoe UI,sans-serif">
  <g><rect width="520" height="82" rx="14" fill="#102A2F" stroke="#285159"/><circle cx="30" cy="41" r="10" fill="#43C7C7"/><text x="55" y="34" fill="#F4F7F8" font-size="17" font-weight="700">The model proposes dimension scores</text><text x="55" y="58" fill="#A6B6BA" font-size="14">Structured text and supporting rationale enter the pipeline.</text></g>
  <g transform="translate(0 104)"><rect width="520" height="82" rx="14" fill="#102A2F" stroke="#285159"/><circle cx="30" cy="41" r="10" fill="#F2B84B"/><text x="55" y="34" fill="#F4F7F8" font-size="17" font-weight="700">The server validates every input</text><text x="55" y="58" fill="#A6B6BA" font-size="14">Weights, ranges, evidence, finance, and risk rules are checked.</text></g>
  <g transform="translate(0 208)"><rect width="520" height="82" rx="14" fill="#102A2F" stroke="#285159"/><circle cx="30" cy="41" r="10" fill="#54D69A"/><text x="55" y="34" fill="#F4F7F8" font-size="17" font-weight="700">The authoritative score is recalculated</text><text x="55" y="58" fill="#A6B6BA" font-size="14">The AI-proposed overall score and verdict are not trusted.</text></g>
  <g transform="translate(0 312)"><rect width="520" height="82" rx="14" fill="#102A2F" stroke="#285159"/><circle cx="30" cy="41" r="10" fill="#70A7FF"/><text x="55" y="34" fill="#F4F7F8" font-size="17" font-weight="700">Every output uses one canonical object</text><text x="55" y="58" fill="#A6B6BA" font-size="14">Dashboard, Decision Room, PDF, PowerPoint, and Excel stay aligned.</text></g>
</g>
<g transform="translate(800 600)" font-family="Inter,Segoe UI,sans-serif"><rect width="520" height="56" rx="14" fill="#0E5F63"/><text x="260" y="35" text-anchor="middle" fill="#fff" font-size="15" font-weight="750">AI-SUPPORTED RECOMMENDATION · SERVER-VALIDATED</text></g>
</svg>